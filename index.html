<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b1c"><title>NEON RUSH — 3D Runner</title><script src="./config.js"></script><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b1c;color:#f4f7ff;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;padding:env(safe-area-inset-top) 14px;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding-top:10px}.brand{font-weight:1000;letter-spacing:2px;font-size:23px;text-shadow:0 0 18px #52f5ff77}.brand span{color:#52f5ff}.stats{display:flex;gap:8px}.pill{background:#0b1234cc;border:1px solid #52f5ff55;border-radius:13px;padding:7px 10px;min-width:68px;text-align:center}.pill small{display:block;font-size:10px;color:#9caed9}.pill b{font-size:18px}#pause{pointer-events:auto;border:1px solid #52f5ff55;color:white;background:#0b1234cc;border-radius:12px;padding:9px 12px}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#05091b55,#05091bd9);z-index:5}.panel{width:min(440px,100%);padding:26px 22px;border-radius:25px;background:linear-gradient(150deg,#151d42f2,#090d24f5);border:1px solid #6ef6ff66;box-shadow:0 0 55px #00d9ff20;text-align:center}.kicker{color:#52f5ff;font-size:11px;letter-spacing:4px;font-weight:800}h1{font-size:clamp(38px,10vw,56px);line-height:.98;margin:12px 0;font-weight:1000}h1 em{font-style:normal;color:#52f5ff}.desc{color:#b6c4e7;font-size:14px;line-height:1.55;margin:0 auto 20px;max-width:330px}.primary,.secondary{pointer-events:auto;border:0;border-radius:14px;padding:14px 18px;font-weight:900;width:100%;font-size:15px}.primary{color:#06101f;background:linear-gradient(100deg,#52f5ff,#b1fbff)}.secondary{margin-top:10px;background:#ffffff0b;color:#dce9ff;border:1px solid #ffffff20}.note{font-size:11px;color:#7889b5;margin-top:15px;line-height:1.5}#controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.group{display:flex;gap:9px}.ctrl{pointer-events:auto;width:58px;height:54px;border-radius:16px;border:1px solid #52f5ff66;background:#09132cbb;color:white;font-size:25px;font-weight:900}.hidden{display:none!important}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#101736ee;border:1px solid #52f5ff55;border-radius:99px;font-size:12px;opacity:0;pointer-events:none}
</style></head><body><div id="game"></div><div class="hud"><div class="top"><div class="brand">NEON <span>RUSH</span></div><div class="stats"><div class="pill"><small>SCORE</small><b id="score">0</b></div><div class="pill"><small>COINS</small><b id="coins">0</b></div><button id="pause" class="hidden">Ⅱ</button></div></div></div><div id="controls" class="hidden"><div class="group"><button class="ctrl" id="left">‹</button><button class="ctrl" id="right">›</button></div><div class="group"><button class="ctrl" id="jump">↑</button><button class="ctrl" id="slide">↓</button></div></div><div id="toast"></div><div id="start" class="overlay"><div class="panel"><div class="kicker">ARCADE • 3D RUNNER</div><h1>NEON<br><em>RUSH</em></h1><p class="desc">Race through a glowing cyber-city. Dodge barriers, jump over hazards, collect energy coins, and beat your best score.</p><button class="primary" id="startBtn">START RUN</button><button class="secondary" id="how">HOW TO PLAY</button><div class="note">Original prototype · No cash prizes · Ads are not enabled</div></div></div><div id="end" class="overlay hidden"><div class="panel"><div class="kicker">RUN COMPLETE</div><h1>NICE<br><em>RUN!</em></h1><p class="desc" id="summary"></p><button class="primary" id="again">RUN AGAIN</button><button class="secondary hidden" id="rewardAd">WATCH AD · DOUBLE SCORE</button><button class="secondary" id="menu">MAIN MENU</button><div class="note">Best score saved on this device.</div></div></div>
<script>(()=>{const $=id=>document.getElementById(id);const config=window.NEON_CONFIG||{};const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor('#080b1c');tg?.setBackgroundColor('#080b1c')}catch(e){};let scene,camera,renderer,clock,player,core,road,city;let obs=[],coins3=[],running=false,paused=false,ended=false,lane=0,jy=0,jv=0,slideT=0,score=0,coinCount=0,spawn=0,coinSpawn=1,speed=18,distance=0,rewardAdController=null,adBusy=false,rewardUsed=false;const laneX=[-2.35,0,2.35];const material=(c,e=c,i=.3)=>new THREE.MeshStandardMaterial({color:c,emissive:e,emissiveIntensity:i,metalness:.15,roughness:.4});const M={cyan:material(0x52f5ff,0x00dfff,.8),pink:material(0xff4fd8,0xff00b8,.7),purple:material(0x7065ff,0x4c3dff,.5),dark:material(0x101832,0x152450,.18),white:material(0xeafaff,0x8cefff,.3),gold:material(0xffd75a,0xffae00,.8),red:material(0xff426a,0xff174f,.8),road:material(0x10152a,0x121b3b,.1)};function box(w,h,d,m,x=0,y=0,z=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);return o}function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x080b1c);scene.fog=new THREE.FogExp2(0x080b1c,.012);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);camera.position.set(0,5.5,10.8);camera.lookAt(0,1,-5);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x9ebaff,0x15102e,2));let light=new THREE.DirectionalLight(0x9bfaff,2);light.position.set(-3,9,5);scene.add(light);let pl=new THREE.PointLight(0xff36cf,8,24);pl.position.set(5,4,-9);scene.add(pl);road=new THREE.Group();scene.add(road);road.add(box(9,.25,150,M.road,0,-.2,-45));for(let x of [-1.175,1.175])road.add(box(.035,.02,150,M.cyan,x,-.055,-45));for(let x of [-4.65,4.65])road.add(box(.15,.25,150,M.pink,x,-.05,-45));for(let z=10;z>-135;z-=5)road.add(box(.055,.025,1.6,M.purple,0,-.055,z));let grid=new THREE.GridHelper(180,60,0x253c7d,0x17234b);grid.position.set(0,-.07,-55);scene.add(grid);city=new THREE.Group();scene.add(city);for(let s of [-1,1])for(let i=0;i<32;i++){let h=2+Math.random()*12,w=1.2+Math.random()*2,z=8-i*4.3,x=s*(6.8+Math.random()*5);city.add(box(w,h,w,M.dark,x,h/2-.1,z));city.add(box(.05,h*.7,.05,Math.random()>.5?M.cyan:M.pink,x+s*w*.35,h*.53,z-w*.51))}let sg=new THREE.BufferGeometry(),p=[];for(let i=0;i<240;i++)p.push((Math.random()-.5)*100,Math.random()*35+4,-Math.random()*150);sg.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x9bbaff,size:.09,opacity:.75,transparent:true})));player=new THREE.Group();player.position.set(0,0,2.2);scene.add(player);core=new THREE.Group();player.add(core);core.add(box(.62,.82,.38,M.cyan,0,1.05,0));core.add(box(.5,.22,.44,M.white,0,1.58,0));core.add(box(.16,.14,.08,M.pink,-.13,1.6,-.23));core.add(box(.16,.14,.08,M.pink,.13,1.6,-.23));core.add(box(.2,.52,.22,M.purple,-.2,.38,0));core.add(box(.2,.52,.22,M.purple,.2,.38,0));core.add(box(.18,.56,.2,M.white,-.44,1.05,0));core.add(box(.18,.56,.2,M.white,.44,1.05,0));let ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.035,6,24),M.cyan);ring.rotation.x=Math.PI/2;ring.position.y=.05;player.add(ring);clock=new THREE.Clock();addEventListener('resize',resize);animate()}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight)}function obstacle(){let li=Math.floor(Math.random()*3),r=Math.random(),o=new THREE.Group();if(r<.56){o.add(box(1.25,1.25,.85,M.red,0,.63,0));o.add(box(1.35,.08,.9,M.pink,0,1.28,0));o.userData.kind='block'}else if(r<.8){o.add(box(1.5,.32,.8,M.gold,0,.18,0));o.add(box(1.65,.08,.9,M.pink,0,.36,0));o.userData.kind='jump'}else{o.add(box(1.5,1.8,.7,M.purple,0,1.35,0));o.add(box(1.65,.09,.82,M.cyan,0,2.25,0));o.userData.kind='slide'}o.position.set(laneX[li],0,-85);o.userData.lane=li;scene.add(o);obs.push(o)}function coinRow(){let li=Math.floor(Math.random()*3);for(let i=0;i<5;i++){let c=new THREE.Mesh(new THREE.TorusGeometry(.32,.11,8,16),M.gold);c.position.set(laneX[li],1.15,-65-i*1.8);c.rotation.x=Math.PI/2;scene.add(c);coins3.push(c)}}function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,1000)}function hud(){$('score').textContent=Math.floor(score);$('coins').textContent=coinCount}function start(){rewardUsed=false;$('rewardAd').disabled=false;$('rewardAd').textContent='WATCH AD · DOUBLE SCORE';obs.forEach(o=>scene.remove(o));coins3.forEach(c=>scene.remove(c));obs=[];coins3=[];score=0;coinCount=0;spawn=.7;coinSpawn=2;speed=18;distance=0;lane=0;jy=0;jv=0;slideT=0;player.position.set(0,0,2.2);core.scale.set(1,1,1);running=true;paused=false;ended=false;clock.getDelta();$('start').classList.add('hidden');$('end').classList.add('hidden');$('controls').classList.remove('hidden');$('pause').classList.remove('hidden');$('pause').textContent='Ⅱ';hud()}function renderSummary(){let best=Math.max(Number(localStorage.getItem('neonRushBest')||0),Math.floor(score));localStorage.setItem('neonRushBest',best);$('summary').innerHTML=`Score <b>${Math.floor(score)}</b> · Coins <b>${coinCount}</b><br>Personal best <b>${best}</b>`}function finish(){if(ended)return;ended=true;running=false;renderSummary();$('rewardAd').classList.toggle('hidden',!config.adsgramRewardedBlockId||rewardUsed);$('end').classList.remove('hidden');$('controls').classList.add('hidden');$('pause').classList.add('hidden')}function move(d){if(running&&!paused)lane=Math.max(-1,Math.min(1,lane+d))}function jump(){if(running&&!paused&&jy<=.03){jv=8.5;slideT=0}}function slide(){if(running&&!paused)slideT=.65}function pause(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';if(!paused)clock.getDelta();toast(paused?'PAUSED':'RESUMED')}function update(dt){if(!running||paused)return;speed=Math.min(29,speed+dt*.16);distance+=speed*dt;score+=dt*10;player.position.x+=(laneX[lane+1]-player.position.x)*Math.min(1,dt*12);if(jv!==0||jy>0){jy+=jv*dt;jv-=20*dt;if(jy<0){jy=0;jv=0}}if(slideT>0)slideT-=dt;player.position.y=jy;core.scale.y=slideT>0?.55:1;core.position.y=slideT>0?-.25:0;core.rotation.z=(laneX[lane+1]-player.position.x)*-.04;spawn-=dt;if(spawn<=0){obstacle();spawn=Math.max(.55,1.1-(speed-18)*.025)+Math.random()*.25}coinSpawn-=dt;if(coinSpawn<=0){coinRow();coinSpawn=2.5+Math.random()*1.3}for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.position.z+=speed*dt;if(Math.abs(o.position.z-2.2)<1&&Math.abs(player.position.x-laneX[o.userData.lane])<.95){let safe=(o.userData.kind==='jump'&&jy>.48)||(o.userData.kind==='slide'&&slideT>0);if(!safe){finish();break}}if(o.position.z>10){scene.remove(o);obs.splice(i,1)}}for(let i=coins3.length-1;i>=0;i--){let c=coins3[i];c.position.z+=speed*dt;c.rotation.z+=dt*2.5;if(Math.abs(c.position.z-2.2)<1.1&&Math.abs(player.position.x-c.position.x)<.9&&Math.abs(jy+1.1-c.position.y)<1.5){coinCount++;score+=25;scene.remove(c);coins3.splice(i,1);continue}if(c.position.z>8){scene.remove(c);coins3.splice(i,1)}}for(let ch of road.children)if(ch.geometry?.parameters?.depth===1.6){ch.position.z+=speed*dt;if(ch.position.z>12)ch.position.z=-135}city.position.z+=speed*dt*.28;if(city.position.z>20)city.position.z=0;camera.position.x+=(player.position.x*.12-camera.position.x)*dt*.8;camera.lookAt(player.position.x*.12,1,-5);hud()}function animate(){requestAnimationFrame(animate);let dt=Math.min(clock?.getDelta()||.016,.04);update(dt);if(renderer)renderer.render(scene,camera)}async function claimReward(){if(adBusy||rewardUsed)return;if(!config.adsgramRewardedBlockId){toast('Rewarded ads are not configured');return}try{if(!rewardAdController&&window.Adsgram)rewardAdController=window.Adsgram.init({blockId:config.adsgramRewardedBlockId});if(!rewardAdController){toast('Ad is loading. Try again shortly.');return}adBusy=true;$('rewardAd').disabled=true;$('rewardAd').textContent='LOADING AD…';const result=await rewardAdController.show();if(result&&result.done===true&&result.error!==true){score=Math.floor(score*2);rewardUsed=true;renderSummary();$('rewardAd').classList.add('hidden');toast('DOUBLE SCORE UNLOCKED')}else{toast('Ad was not completed; no bonus granted')}}catch(err){console.warn('AdsGram rewarded ad failed',err);toast('No ad available right now')}finally{adBusy=false;$('rewardAd').disabled=false;$('rewardAd').textContent='WATCH AD · DOUBLE SCORE'}}function setupAds(){const id=config.adsgramRewardedBlockId;if(!id||String(id).includes('PASTE_'))return;$('rewardAd').classList.remove('hidden');const script=document.createElement('script');script.src='https://sad.adsgram.ai/js/sad.min.js';script.async=true;script.dataset.adsgram='1';script.onload=()=>{try{if(window.Adsgram)rewardAdController=window.Adsgram.init({blockId:id})}catch(err){console.warn('AdsGram initialization failed',err)}};script.onerror=()=>console.warn('AdsGram SDK could not be loaded');document.head.appendChild(script)}$('rewardAd').onclick=claimReward;setupAds();$('startBtn').onclick=start;$('again').onclick=start;$('menu').onclick=()=>{$('end').classList.add('hidden');$('start').classList.remove('hidden')};$('how').onclick=()=>toast('← → dodge · ↑ jump · ↓ slide');$('pause').onclick=pause;$('left').onpointerdown=e=>{e.preventDefault();move(-1)};$('right').onpointerdown=e=>{e.preventDefault();move(1)};$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('slide').onpointerdown=e=>{e.preventDefault();slide()};addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(['ArrowUp','w',' '].includes(e.key))jump();if(e.key==='ArrowDown'||e.key==='s')slide();if(e.key==='Escape')pause()});let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!running||e.target.closest('button'))return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(Math.abs(dy)>28)(dy<0?jump:slide)()},{passive:true});init()})();</script></body></html>
